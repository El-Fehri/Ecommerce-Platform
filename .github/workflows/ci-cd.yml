name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: saas_ecommerce_test
          MYSQL_USER: saas_user
          MYSQL_PASSWORD: saas_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql
          tools: composer:v2
          coverage: xdebug
      
      - name: Install Dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Setup Environment
        working-directory: ./backend
        run: |
          cp .env.example .env
          php artisan key:generate
      
      - name: Run Migrations
        working-directory: ./backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: saas_ecommerce_test
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_password
      
      - name: Run Tests
        working-directory: ./backend
        run: php artisan test --coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: saas_ecommerce_test
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend
          flags: backend
          fail_ci_if_error: false

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run Type Check
        working-directory: ./frontend
        run: npm run type-check
      
      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test:unit
      
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push PHP Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/php
          file: ./docker/php/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-php:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-php:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-php:buildcache,mode=max
      
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-nginx:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-nginx:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/saas-ecommerce-nginx:buildcache,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/saas-ecommerce-staging
            git pull origin develop
            docker-compose pull
            docker-compose up -d --build
            docker-compose exec php php artisan migrate --force
            docker-compose exec php php artisan optimize

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /var/www/saas-ecommerce-production
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
            docker-compose exec php php artisan migrate --force
            docker-compose exec php php artisan optimize
            docker-compose restart horizon
