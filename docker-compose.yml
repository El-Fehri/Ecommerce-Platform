version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: saas_ecommerce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - mysql
    networks:
      - saas_network

  # PHP-FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: saas_ecommerce_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - saas_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: saas_ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-saas_ecommerce}
      MYSQL_USER: ${DB_USERNAME:-saas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-saas_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - saas_network

  # Redis
  redis:
    image: redis:alpine
    container_name: saas_ecommerce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - saas_network

  # Node.js for Frontend Build
  node:
    image: node:20-alpine
    container_name: saas_ecommerce_node
    restart: unless-stopped
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
      - node_modules:/var/www/frontend/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    networks:
      - saas_network

  # Laravel Horizon (Queue Worker)
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: saas_ecommerce_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php
      - redis
    command: php artisan horizon
    networks:
      - saas_network

  # Laravel Scheduler
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: saas_ecommerce_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php
      - mysql
      - redis
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    networks:
      - saas_network

  # Mailhog (Development)
  mailhog:
    image: mailhog/mailhog
    container_name: saas_ecommerce_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local
