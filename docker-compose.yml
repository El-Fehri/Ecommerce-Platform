version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_ecommerce_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - saas_network
    depends_on:
      - mysql
      - redis

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: saas_ecommerce_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - saas_network
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: saas_ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saas_network

  redis:
    image: redis:alpine
    container_name: saas_ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - saas_network

  node:
    image: node:20-alpine
    container_name: saas_ecommerce_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./frontend:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - saas_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: saas_ecommerce_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - saas_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_ecommerce_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    command: php artisan horizon
    networks:
      - saas_network
    depends_on:
      - redis
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_ecommerce_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    command: php artisan schedule:work
    networks:
      - saas_network
    depends_on:
      - mysql

networks:
  saas_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
